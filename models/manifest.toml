path = "models/vendor/lm741.lib"
url = "https://www.ti.com/lit/zip/snom211"
notes = "National Semiconductor (TI) Boyle macromodel, extracted from snom211.zip. Kept unversioned (models/vendor/ is gitignored) because the no-resale clause conflicts with the repo MIT license. Re-fetch: curl -L -o snom211.zip <url> && unzip. Subckt LM741, pins: +in -in V+ V- out."

