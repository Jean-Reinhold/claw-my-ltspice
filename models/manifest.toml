[[models]]
name = "OP07"
kind = "opamp"
source = "ltspice-built-in"
license = "provided-by-ltspice-install"
redistributable = false
notes = "ADI OP07 precision op-amp macromodel shipped inside the LTspice 26 install (lib/sub/LTC.lib, grades OP07/OP07A/OP07C/OP07E). Netlists reference it with `.lib LTC.lib`; LTspice resolves its own library path inside the container. Documentation copies can be extracted with scripts/models/extract-op07.sh into experiments/<slug>/models/ (gitignored). Do not commit extracted copies. Used by experiments/rs1-nao-idealidades-op07 (RS1 roteiro)."

